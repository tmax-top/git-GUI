appId: com.gitgui.desktop
productName: GitGUI
directories:
  output: dist
npmRebuild: false
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - '**/node-pty/**'
win:
  target:
    - target: zip
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: '${productName}-${version}-windows-${arch}.${ext}'
portable:
  artifactName: '${productName}-${version}-windows-portable.${ext}'
